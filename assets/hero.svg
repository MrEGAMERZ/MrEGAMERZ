<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#80abff"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <!-- Grid Dot Pattern -->
    <pattern id="hero-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.12"/>
    </pattern>

    <!-- Rising Mask for Name Reveal -->
    <clipPath id="hero-name-mask">
      <rect x="0" y="65" width="880" height="85">
        <animate attributeName="height" values="0;85" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
        <animate attributeName="y" values="150;65" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      </rect>
    </clipPath>

    <!-- Glow Filter -->
    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes heroFadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.8; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .hero-panel {
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.6));
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .hero-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .blink {
      animation: cursorBlink 0.9s infinite;
    }
    .live-dot {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    /* Fallback / safe prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .blink, .live-dot { animation: none; }
    }
  </style>

  <!-- Container Box -->
  <g class="hero-panel">
    <rect x="10" y="10" width="860" height="320" rx="16" fill="url(#hero-bg)"/>
    <rect x="10" y="10" width="860" height="320" rx="16" fill="url(#hero-dots)"/>
    <rect x="10" y="10" width="860" height="320" rx="16" stroke="url(#hero-border)" stroke-width="1.5"/>
  </g>

  <!-- Top Decorative Tech Accents -->
  <line x1="40" y1="10" x2="160" y2="10" stroke="#247bff" stroke-width="2.5"/>
  <circle cx="825" cy="35" r="4" fill="#247bff" class="live-dot"/>
  <circle cx="840" cy="35" r="4" fill="#ff354f"/>
  <text x="735" y="38" fill="#64748b" class="hero-mono" font-size="11" letter-spacing="1.5">SYS.ONLINE</text>

  <!-- Command Line / Greeting -->
  <g transform="translate(45, 52)">
    <rect x="0" y="-14" width="75" height="22" rx="4" fill="#0d152d" stroke="#247bff" stroke-width="1"/>
    <text x="8" y="1" fill="#247bff" class="hero-mono" font-size="11" font-weight="700">KERNEL</text>
    <text x="88" y="1" fill="#94a3b8" class="hero-mono" font-size="13">~/engineer $ </text>
    <text x="180" y="1" fill="#e2e8f0" class="hero-mono" font-size="13">cat greeting.log &amp;&amp; whoami</text>
    <rect x="365" y="-12" width="7" height="15" fill="#247bff" class="blink"/>
  </g>

  <!-- Large Rising-Mask Name Reveal -->
  <g clip-path="url(#hero-name-mask)">
    <text x="45" y="128" fill="url(#name-grad)" class="hero-title" font-size="52" filter="url(#hero-glow)">
      MOHAMMAD REHAN
    </text>
  </g>

  <!-- Subtle Badge Pill Next to Name -->
  <g transform="translate(620, 95)">
    <rect x="0" y="0" width="195" height="30" rx="15" fill="#0c1633" stroke="#247bff" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="4" fill="#247bff" class="live-dot"/>
    <text x="28" y="19" fill="#93c5fd" class="hero-mono" font-size="11" font-weight="600" letter-spacing="0.5">SIH '26 SEMI-FINALIST</text>
  </g>

  <!-- 4 Cycling Roles (SMIL Animated Loop with Smooth Cross-fades) -->
  <g transform="translate(45, 175)">
    <!-- Terminal Prefix Symbol -->
    <text x="0" y="0" fill="#247bff" class="hero-mono" font-size="17" font-weight="800">❯</text>
    <text x="18" y="0" fill="#64748b" class="hero-mono" font-size="16">ROLE:</text>

    <!-- Role 1: AI/ML Engineer -->
    <g class="role-item">
      <text x="75" y="0" fill="#247bff" class="hero-mono" font-size="17" font-weight="700">
        AI / ML Engineer
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" dur="12s" begin="0s" repeatCount="indefinite" keyTimes="0;0.22;0.25;0.97;0.98;0.99;0.995;0.999;1"/>
      </text>
    </g>

    <!-- Role 2: LLM & RL Researcher -->
    <g class="role-item">
      <text x="75" y="0" fill="#ff354f" class="hero-mono" font-size="17" font-weight="700">
        LLM &amp; Reinforcement Learning (GRPO)
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" dur="12s" begin="0s" repeatCount="indefinite" keyTimes="0;0.24;0.26;0.47;0.50;0.97;0.98;0.99;1"/>
      </text>
    </g>

    <!-- Role 3: Intelligent System Architect -->
    <g class="role-item">
      <text x="75" y="0" fill="#38bdf8" class="hero-mono" font-size="17" font-weight="700">
        Intelligent System Architect
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="12s" begin="0s" repeatCount="indefinite" keyTimes="0;0.49;0.50;0.51;0.53;0.72;0.75;0.98;1"/>
      </text>
    </g>

    <!-- Role 4: Flow-State Systems Developer -->
    <g class="role-item">
      <text x="75" y="0" fill="#a78bfa" class="hero-mono" font-size="17" font-weight="700">
        Flow-State Systems Developer
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="12s" begin="0s" repeatCount="indefinite" keyTimes="0;0.73;0.74;0.75;0.76;0.78;0.96;0.98;1"/>
      </text>
    </g>
  </g>

  <!-- One-Line Pitch -->
  <g transform="translate(45, 218)">
    <text x="0" y="0" fill="#94a3b8" class="hero-sub" font-size="15" font-weight="400">
      Architecting privacy-first on-device AI agents, resilient RL models, &amp; native desktop utilities.
    </text>
  </g>

  <!-- Hairline Divider -->
  <line x1="45" y1="248" x2="835" y2="248" stroke="#1e293b" stroke-width="1"/>
  <line x1="45" y1="248" x2="190" y2="248" stroke="url(#accent-grad)" stroke-width="1.5"/>

  <!-- Location, Status & Coordinates Row -->
  <g transform="translate(45, 285)">
    <!-- Location -->
    <g>
      <circle cx="6" cy="-4" r="3" fill="#247bff"/>
      <text x="16" y="0" fill="#cbd5e1" class="hero-mono" font-size="13">BANGALORE, IN</text>
      <text x="135" y="0" fill="#475569" class="hero-mono" font-size="13">|</text>
    </g>

    <!-- Focus -->
    <g transform="translate(150, 0)">
      <text x="0" y="0" fill="#94a3b8" class="hero-mono" font-size="13">FOCUS:</text>
      <text x="56" y="0" fill="#e2e8f0" class="hero-mono" font-size="13">ON-DEVICE ML · GRPO · AGENTS</text>
      <text x="295" y="0" fill="#475569" class="hero-mono" font-size="13">|</text>
    </g>

    <!-- Terminal Status Badge -->
    <g transform="translate(470, 0)">
      <rect x="0" y="-13" width="95" height="18" rx="3" fill="#0b241b" stroke="#10b981" stroke-width="0.8"/>
      <circle cx="10" cy="-4" r="2.5" fill="#10b981"/>
      <text x="20" y="0" fill="#34d399" class="hero-mono" font-size="10.5" font-weight="700">STATUS: OPEN</text>
    </g>

    <!-- Latency / Version Tag -->
    <g transform="translate(680, 0)">
      <text x="0" y="0" fill="#475569" class="hero-mono" font-size="12">v2026.10 // ID: MR-01</text>
    </g>
  </g>
</svg>
