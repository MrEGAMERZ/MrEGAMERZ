<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="500" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arsenal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="arsenal-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="arsenal-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1733"/>
      <stop offset="100%" stop-color="#090f22"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="arsenal-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#247bff" fill-opacity="0.12"/>
    </pattern>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="arsenal-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
    }
    .title {
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="860" height="480" rx="16" fill="url(#arsenal-bg)"/>
  <rect x="10" y="10" width="860" height="480" rx="16" fill="url(#arsenal-dots)"/>
  <rect x="10" y="10" width="860" height="480" rx="16" stroke="url(#arsenal-border)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="115" height="20" rx="4" fill="#0d1b38" stroke="#247bff" stroke-width="1"/>
    <text x="8" y="14" fill="#247bff" class="font-mono" font-size="10.5" font-weight="700">TECH ARSENAL</text>
    <text x="128" y="15" fill="#f8fafc" class="font-sans title" font-size="18">Battle-Tested Languages, Frameworks &amp; Tooling</text>
    <line x1="0" y1="28" x2="800" y2="28" stroke="#17223b" stroke-width="1"/>
  </g>

  <!-- 6-CARD GRID (2 columns x 3 rows) -->

  <!-- ROW 1, COL 1: PROGRAMMING LANGUAGES -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="385" height="116" rx="10" fill="url(#arsenal-card-bg)" stroke="#1d2d52" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#247bff"/>
    <text x="18" y="24" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">⌨ LANGUAGES</text>
    <text x="18" y="44" fill="#94a3b8" class="font-sans" font-size="11.5">Primary systems, algorithms &amp; application codebases</text>
    
    <!-- Pills -->
    <g transform="translate(18, 58)">
      <!-- Python -->
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="8" y="15" fill="#93c5fd" class="badge">Python</text>
      <!-- Swift 5 -->
      <rect x="66" y="0" width="58" height="22" rx="4" fill="#2d131f" stroke="#ff354f" stroke-width="0.8"/>
      <text x="74" y="15" fill="#fda4af" class="badge">Swift 5</text>
      <!-- TypeScript -->
      <rect x="130" y="0" width="80" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="137" y="15" fill="#93c5fd" class="badge">TypeScript</text>
      <!-- JavaScript -->
      <rect x="216" y="0" width="76" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="224" y="15" fill="#cbd5e1" class="badge">JavaScript</text>
      <!-- C++ -->
      <rect x="298" y="0" width="44" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="306" y="15" fill="#cbd5e1" class="badge">C++</text>
    </g>
    <g transform="translate(18, 86)">
      <!-- C# -->
      <rect x="0" y="0" width="40" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="8" y="15" fill="#cbd5e1" class="badge">C#</text>
      <!-- Dart -->
      <rect x="46" y="0" width="48" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="54" y="15" fill="#cbd5e1" class="badge">Dart</text>
      <!-- SQL -->
      <rect x="100" y="0" width="45" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="108" y="15" fill="#cbd5e1" class="badge">SQL</text>
      <!-- Bash / Shell -->
      <rect x="151" y="0" width="84" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="159" y="15" fill="#cbd5e1" class="badge">Bash / Zsh</text>
    </g>
  </g>

  <!-- ROW 1, COL 2: AI, ML & COMPUTER VISION -->
  <g transform="translate(455, 80)">
    <rect x="0" y="0" width="385" height="116" rx="10" fill="url(#arsenal-card-bg)" stroke="#1d2d52" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#ff354f"/>
    <text x="18" y="24" fill="#ff4d6d" class="font-mono" font-size="12" font-weight="700">🤖 AI, ML &amp; COMPUTER VISION</text>
    <text x="18" y="44" fill="#94a3b8" class="font-sans" font-size="11.5">Fine-tuning, policy optimization &amp; vision pipelines</text>
    
    <!-- Pills -->
    <g transform="translate(18, 58)">
      <!-- PyTorch -->
      <rect x="0" y="0" width="66" height="22" rx="4" fill="#2d131f" stroke="#ff354f" stroke-width="0.8"/>
      <text x="8" y="15" fill="#fda4af" class="badge">PyTorch</text>
      <!-- Llama / GRPO -->
      <rect x="72" y="0" width="124" height="22" rx="4" fill="#2d131f" stroke="#ff354f" stroke-width="0.8"/>
      <text x="80" y="15" fill="#fda4af" class="badge">Llama-3.2 (GRPO)</text>
      <!-- OpenCV -->
      <rect x="202" y="0" width="66" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="210" y="15" fill="#93c5fd" class="badge">OpenCV</text>
      <!-- Gemini API -->
      <rect x="274" y="0" width="78" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="282" y="15" fill="#93c5fd" class="badge">Gemini AI</text>
    </g>
    <g transform="translate(18, 86)">
      <!-- Gym / OpenEnv -->
      <rect x="0" y="0" width="108" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="8" y="15" fill="#cbd5e1" class="badge">Gym / OpenEnv</text>
      <!-- TensorFlow -->
      <rect x="114" y="0" width="84" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="122" y="15" fill="#cbd5e1" class="badge">TensorFlow</text>
      <!-- FAISS / RAG -->
      <rect x="204" y="0" width="86" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="212" y="15" fill="#cbd5e1" class="badge">FAISS (RAG)</text>
      <!-- Local ML -->
      <rect x="296" y="0" width="66" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="303" y="15" fill="#cbd5e1" class="badge">ONNX / ML</text>
    </g>
  </g>

  <!-- ROW 2, COL 1: BACKEND, ASYNC & APIS -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="385" height="116" rx="10" fill="url(#arsenal-card-bg)" stroke="#1d2d52" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#10b981"/>
    <text x="18" y="24" fill="#34d399" class="font-mono" font-size="12" font-weight="700">⚡ BACKEND, APIS &amp; ASYNC</text>
    <text x="18" y="44" fill="#94a3b8" class="font-sans" font-size="11.5">High-throughput microservices &amp; state management</text>
    
    <!-- Pills -->
    <g transform="translate(18, 58)">
      <!-- FastAPI -->
      <rect x="0" y="0" width="62" height="22" rx="4" fill="#0b241e" stroke="#10b981" stroke-width="0.8"/>
      <text x="8" y="15" fill="#6ee7b7" class="badge">FastAPI</text>
      <!-- SQLAlchemy -->
      <rect x="68" y="0" width="90" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="76" y="15" fill="#93c5fd" class="badge">SQLAlchemy</text>
      <!-- Redis -->
      <rect x="164" y="0" width="52" height="22" rx="4" fill="#2d131f" stroke="#ff354f" stroke-width="0.8"/>
      <text x="172" y="15" fill="#fda4af" class="badge">Redis</text>
      <!-- PostgreSQL -->
      <rect x="222" y="0" width="80" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="230" y="15" fill="#93c5fd" class="badge">PostgreSQL</text>
      <!-- Uvicorn -->
      <rect x="308" y="0" width="58" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="315" y="15" fill="#cbd5e1" class="badge">Uvicorn</text>
    </g>
    <g transform="translate(18, 86)">
      <!-- Alembic -->
      <rect x="0" y="0" width="66" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="8" y="15" fill="#cbd5e1" class="badge">Alembic</text>
      <!-- ARQ / Background Workers -->
      <rect x="72" y="0" width="94" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="80" y="15" fill="#cbd5e1" class="badge">ARQ Workers</text>
      <!-- WebSockets -->
      <rect x="172" y="0" width="88" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="180" y="15" fill="#cbd5e1" class="badge">WebSockets</text>
      <!-- Firebase -->
      <rect x="266" y="0" width="68" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="274" y="15" fill="#cbd5e1" class="badge">Firebase</text>
    </g>
  </g>

  <!-- ROW 2, COL 2: DESKTOP & NATIVE MACOS/IOS -->
  <g transform="translate(455, 210)">
    <rect x="0" y="0" width="385" height="116" rx="10" fill="url(#arsenal-card-bg)" stroke="#1d2d52" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#38bdf8"/>
    <text x="18" y="24" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">🪟 DESKTOP, NATIVE MACOS &amp; MOBILE</text>
    <text x="18" y="44" fill="#94a3b8" class="font-sans" font-size="11.5">High-performance native apps &amp; zero-overhead utilities</text>
    
    <!-- Pills -->
    <g transform="translate(18, 58)">
      <!-- AppKit -->
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#2d131f" stroke="#ff354f" stroke-width="0.8"/>
      <text x="8" y="15" fill="#fda4af" class="badge">AppKit</text>
      <!-- SwiftUI -->
      <rect x="66" y="0" width="64" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="74" y="15" fill="#93c5fd" class="badge">SwiftUI</text>
      <!-- UIKit / iOS -->
      <rect x="136" y="0" width="70" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="144" y="15" fill="#93c5fd" class="badge">UIKit iOS</text>
      <!-- CoreData -->
      <rect x="212" y="0" width="72" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="220" y="15" fill="#cbd5e1" class="badge">CoreData</text>
      <!-- macOS Dock -->
      <rect x="290" y="0" width="74" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="297" y="15" fill="#cbd5e1" class="badge">SIDEDOCK</text>
    </g>
    <g transform="translate(18, 86)">
      <!-- Flutter -->
      <rect x="0" y="0" width="62" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="8" y="15" fill="#93c5fd" class="badge">Flutter</text>
      <!-- Chrome MV3 -->
      <rect x="68" y="0" width="128" height="22" rx="4" fill="#2d131f" stroke="#ff354f" stroke-width="0.8"/>
      <text x="76" y="15" fill="#fda4af" class="badge">Chrome MV3 Agents</text>
      <!-- Audio/Mic Engine -->
      <rect x="202" y="0" width="100" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="209" y="15" fill="#cbd5e1" class="badge">CoreAudio Engine</text>
    </g>
  </g>

  <!-- ROW 3, COL 1: FRONTEND, UI & CREATIVE ENGINES -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="385" height="116" rx="10" fill="url(#arsenal-card-bg)" stroke="#1d2d52" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#8b5cf6"/>
    <text x="18" y="24" fill="#a78bfa" class="font-mono" font-size="12" font-weight="700">🎨 FRONTEND, WEB &amp; GAME ENGINES</text>
    <text x="18" y="44" fill="#94a3b8" class="font-sans" font-size="11.5">Interactive web interfaces &amp; 3D physics gameplay</text>
    
    <!-- Pills -->
    <g transform="translate(18, 58)">
      <!-- React 19 -->
      <rect x="0" y="0" width="68" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="8" y="15" fill="#93c5fd" class="badge">React 19</text>
      <!-- Next.js -->
      <rect x="74" y="0" width="62" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="82" y="15" fill="#93c5fd" class="badge">Next.js</text>
      <!-- Tailwind CSS -->
      <rect x="142" y="0" width="88" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="150" y="15" fill="#93c5fd" class="badge">Tailwind CSS</text>
      <!-- Vite -->
      <rect x="236" y="0" width="44" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="244" y="15" fill="#cbd5e1" class="badge">Vite</text>
      <!-- HTML/CSS -->
      <rect x="286" y="0" width="76" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="293" y="15" fill="#cbd5e1" class="badge">HTML5/CSS3</text>
    </g>
    <g transform="translate(18, 86)">
      <!-- Unity -->
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#201538" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="8" y="15" fill="#ddd6fe" class="badge">Unity</text>
      <!-- 3D Physics -->
      <rect x="61" y="0" width="86" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="69" y="15" fill="#cbd5e1" class="badge">Game Physics</text>
      <!-- Tkinter -->
      <rect x="153" y="0" width="60" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="161" y="15" fill="#cbd5e1" class="badge">Tkinter</text>
      <!-- Responsive UI -->
      <rect x="219" y="0" width="98" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="226" y="15" fill="#cbd5e1" class="badge">Design Systems</text>
    </g>
  </g>

  <!-- ROW 3, COL 2: DEVOPS, TESTING & HARMONY -->
  <g transform="translate(455, 340)">
    <rect x="0" y="0" width="385" height="116" rx="10" fill="url(#arsenal-card-bg)" stroke="#1d2d52" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="116" rx="2" fill="#06b6d4"/>
    <text x="18" y="24" fill="#22d3ee" class="font-mono" font-size="12" font-weight="700">🛠️ DEVOPS, TESTING &amp; HARDWARE</text>
    <text x="18" y="44" fill="#94a3b8" class="font-sans" font-size="11.5">Containers, automated test harnesses &amp; PC setups</text>
    
    <!-- Pills -->
    <g transform="translate(18, 58)">
      <!-- Docker -->
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="8" y="15" fill="#93c5fd" class="badge">Docker</text>
      <!-- Docker Compose -->
      <rect x="66" y="0" width="112" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="74" y="15" fill="#93c5fd" class="badge">Docker Compose</text>
      <!-- Playwright -->
      <rect x="184" y="0" width="82" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="192" y="15" fill="#cbd5e1" class="badge">Playwright</text>
      <!-- Pytest -->
      <rect x="272" y="0" width="58" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="280" y="15" fill="#cbd5e1" class="badge">Pytest</text>
    </g>
    <g transform="translate(18, 86)">
      <!-- Git & GitHub Actions -->
      <rect x="0" y="0" width="115" height="22" rx="4" fill="#132347" stroke="#247bff" stroke-width="0.8"/>
      <text x="8" y="15" fill="#93c5fd" class="badge">GitHub Actions</text>
      <!-- Linux / macOS -->
      <rect x="121" y="0" width="96" height="22" rx="4" fill="#1a1c2e" stroke="#475569" stroke-width="0.8"/>
      <text x="129" y="15" fill="#cbd5e1" class="badge">Linux / macOS</text>
      <!-- PC Hardware -->
      <rect x="223" y="0" width="128" height="22" rx="4" fill="#201538" stroke="#8b5cf6" stroke-width="0.8"/>
      <text x="230" y="15" fill="#ddd6fe" class="badge">PC Hardware Builds</text>
    </g>
  </g>

</svg>
