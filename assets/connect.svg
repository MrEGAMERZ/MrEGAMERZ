<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="conn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0b1227"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="conn-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="conn-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#247bff" fill-opacity="0.12"/>
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="social-card-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1733"/>
      <stop offset="100%" stop-color="#0a1122"/>
    </linearGradient>

    <!-- Holographic Pointer Shield -->
    <linearGradient id="pointer-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
    }
    .title {
      font-weight: 800;
      letter-spacing: -0.02em;
    }
  </style>

  <!-- Base Panel -->
  <rect x="10" y="10" width="860" height="300" rx="16" fill="url(#conn-bg)"/>
  <rect x="10" y="10" width="860" height="300" rx="16" fill="url(#conn-dots)"/>
  <rect x="10" y="10" width="860" height="300" rx="16" stroke="url(#conn-border)" stroke-width="1.5"/>

  <!-- ============================================================ -->
  <!-- LEFT: SLEEK CYBER-POINTER CHARACTER / RADAR AVATAR           -->
  <!-- ============================================================ -->
  <g transform="translate(45, 45)">
    <!-- Radar Base Ring -->
    <circle cx="85" cy="85" r="75" fill="#081024" stroke="#1d2e54" stroke-width="1.2"/>
    <circle cx="85" cy="85" r="55" fill="none" stroke="#247bff" stroke-width="0.8" stroke-dasharray="3,3"/>
    <circle cx="85" cy="85" r="32" fill="#0d1b38" stroke="#38bdf8" stroke-width="1"/>

    <!-- Sweeping Radar Beam -->
    <g transform="rotate(0 85 85)">
      <animateTransform attributeName="transform" type="rotate" from="0 85 85" to="360 85 85" dur="6s" repeatCount="indefinite"/>
      <line x1="85" y1="85" x2="85" y2="10" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
      <polygon points="85,85 70,12 85,10" fill="#38bdf8" opacity="0.15"/>
    </g>

    <!-- Stylized Bot/Operator Core Character -->
    <g transform="translate(85, 85)">
      <!-- Head / Visor -->
      <rect x="-18" y="-22" width="36" height="24" rx="6" fill="#0a142e" stroke="#247bff" stroke-width="1.5"/>
      <rect x="-12" y="-16" width="24" height="10" rx="3" fill="#38bdf8">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </rect>
      <!-- Antennas -->
      <line x1="-12" y1="-22" x2="-16" y2="-28" stroke="#247bff" stroke-width="1.5"/>
      <line x1="12" y1="-22" x2="16" y2="-28" stroke="#247bff" stroke-width="1.5"/>
      
      <!-- Torso -->
      <path d="M-22,7 L22,7 L16,28 L-16,28 Z" fill="#0f1f42" stroke="#1e3a75" stroke-width="1.2"/>
      <circle cx="0" cy="17" r="4" fill="#ff354f"/>
    </g>

    <!-- Extended Right Pointer Arm with Pointing Laser/Arrow -->
    <g transform="translate(110, 92)">
      <!-- Arm extending rightward -->
      <path d="M0,0 L40,-5 L75,0" fill="none" stroke="#247bff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="75" cy="0" r="4.5" fill="#38bdf8"/>

      <!-- Nudging Hologram Pointer Arrow pointing directly into the cards -->
      <g transform="translate(86, -6)">
        <animateTransform 
          attributeName="transform" 
          type="translate" 
          values="86,-6; 98,-6; 86,-6" 
          dur="1.3s" 
          repeatCount="indefinite" 
          calcMode="spline" 
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
        />
        <polygon points="0,6 18,6 18,0 30,8 18,16 18,10 0,10" fill="url(#pointer-shield-grad)"/>
        <polyline points="20,1 28,8 20,15" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Operator Tag Below Avatar -->
    <g transform="translate(85, 185)">
      <text x="0" y="0" text-anchor="middle" fill="#f8fafc" class="font-sans" font-size="14" font-weight="800">CONNECT PROTOCOL</text>
      <text x="0" y="16" text-anchor="middle" fill="#64748b" class="font-mono" font-size="10.5">OPEN FOR COMMITS &amp; COLLAB</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="320" y1="35" x2="320" y2="285" stroke="#17223b" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- RIGHT: GENEROUSLY SPACED SOCIAL CARDS & NUDGING ARROWS       -->
  <!-- ============================================================ -->
  <g transform="translate(345, 36)">
    <!-- Header -->
    <rect x="0" y="0" width="115" height="20" rx="4" fill="#0d1b38" stroke="#247bff" stroke-width="1"/>
    <text x="8" y="14" fill="#247bff" class="font-mono" font-size="10.5" font-weight="700">COMMS CHANNEL</text>
    <text x="128" y="15" fill="#f8fafc" class="font-sans title" font-size="18">Direct Dispatch &amp; Coordinates</text>

    <!-- 4 Structured Social Cards (2x2 Grid) -->
    <g transform="translate(0, 32)">
      
      <!-- CARD 1: LINKEDIN -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="245" height="88" rx="10" fill="url(#social-card-bg)" stroke="#1d2e52" stroke-width="1.2"/>
        
        <!-- Platform Icon (LinkedIn) -->
        <rect x="14" y="14" width="30" height="30" rx="6" fill="#0077b5"/>
        <text x="23" y="34" fill="#ffffff" class="font-sans" font-size="18" font-weight="900">in</text>
        
        <text x="54" y="27" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">LinkedIn</text>
        <text x="54" y="42" fill="#60a5fa" class="font-mono" font-size="11">in/mohammadrehan-dev</text>

        <!-- Nudging Arrow Indicator -->
        <g transform="translate(205, 30)">
          <animateTransform attributeName="transform" type="translate" values="202,30; 210,30; 202,30" dur="1.4s" repeatCount="indefinite"/>
          <path d="M0,0 L8,6 L0,12" fill="none" stroke="#247bff" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="14" y="70" fill="#94a3b8" class="font-sans" font-size="11">Professional network &amp; updates</text>
      </g>

      <!-- CARD 2: X (TWITTER) -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="245" height="88" rx="10" fill="url(#social-card-bg)" stroke="#1d2e52" stroke-width="1.2"/>
        
        <!-- Platform Icon (X) -->
        <rect x="14" y="14" width="30" height="30" rx="6" fill="#000000" stroke="#334155" stroke-width="1"/>
        <text x="23" y="35" fill="#ffffff" class="font-sans" font-size="16" font-weight="900">𝕏</text>
        
        <text x="54" y="27" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">X (Twitter)</text>
        <text x="54" y="42" fill="#93c5fd" class="font-mono" font-size="11">@MR_E_GAMERZ</text>

        <!-- Nudging Arrow Indicator -->
        <g transform="translate(205, 30)">
          <animateTransform attributeName="transform" type="translate" values="202,30; 210,30; 202,30" dur="1.4s" repeatCount="indefinite"/>
          <path d="M0,0 L8,6 L0,12" fill="none" stroke="#247bff" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="14" y="70" fill="#94a3b8" class="font-sans" font-size="11">Thoughts, ML research &amp; builds</text>
      </g>

      <!-- CARD 3: PORTFOLIO -->
      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="245" height="88" rx="10" fill="url(#social-card-bg)" stroke="#1d2e52" stroke-width="1.2"/>
        
        <!-- Platform Icon (Globe/Portfolio) -->
        <rect x="14" y="14" width="30" height="30" rx="6" fill="#1e1026" stroke="#ff354f" stroke-width="1"/>
        <text x="21" y="35" fill="#ff4d6d" class="font-mono" font-size="17">🌐</text>
        
        <text x="54" y="27" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">Personal Portfolio</text>
        <text x="54" y="42" fill="#fda4af" class="font-mono" font-size="11">rehandev.live</text>

        <!-- Nudging Arrow Indicator -->
        <g transform="translate(205, 30)">
          <animateTransform attributeName="transform" type="translate" values="202,30; 210,30; 202,30" dur="1.4s" repeatCount="indefinite"/>
          <path d="M0,0 L8,6 L0,12" fill="none" stroke="#ff354f" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="14" y="70" fill="#94a3b8" class="font-sans" font-size="11">Interactive live showcase &amp; work</text>
      </g>

      <!-- CARD 4: EMAIL -->
      <g transform="translate(260, 102)">
        <rect x="0" y="0" width="245" height="88" rx="10" fill="url(#social-card-bg)" stroke="#1d2e52" stroke-width="1.2"/>
        
        <!-- Platform Icon (Mail) -->
        <rect x="14" y="14" width="30" height="30" rx="6" fill="#14241e" stroke="#10b981" stroke-width="1"/>
        <text x="21" y="34" fill="#34d399" class="font-mono" font-size="16">✉</text>
        
        <text x="54" y="27" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">Direct Dispatch</text>
        <text x="54" y="42" fill="#6ee7b7" class="font-mono" font-size="10.5">mohammadrehan432432@...</text>

        <!-- Nudging Arrow Indicator -->
        <g transform="translate(205, 30)">
          <animateTransform attributeName="transform" type="translate" values="202,30; 210,30; 202,30" dur="1.4s" repeatCount="indefinite"/>
          <path d="M0,0 L8,6 L0,12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="14" y="70" fill="#94a3b8" class="font-sans" font-size="11">Direct inquiries &amp; proposals</text>
      </g>

    </g>
  </g>
</svg>
