      <rect x="0" y="0" width="3" height="96" rx="1.5" fill="#ffffff"/>
      <text x="14" y="26" fill="#ffffff" class="font-mono" font-size="12" font-weight="700">𝕏 Twitter / X</text>
      <text x="14" y="48" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">@MR_E_GAMERZ</text>
      <text x="14" y="68" fill="#94a3b8" class="font-mono" font-size="10.5">Build logs &amp; ML drops</text>
      <text x="14" y="84" fill="#94a3b8" class="font-mono" font-size="10">Follow ➔</text>
