    </text>

    <!-- Tags Row -->
    <g transform="translate(16, 108)">
      <rect x="0" y="0" width="58" height="20" rx="4" fill="#101c38" stroke="#1d2d52" stroke-width="0.8"/>
      <text x="8" y="14" fill="#cbd5e1" class="font-mono" font-size="10">Python</text>

