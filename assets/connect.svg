      <rect x="0" y="0" width="195" height="96" rx="8" fill="#0d101a" stroke="#1c2030" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="96" rx="1.5" fill="#e62429"/>
      <text x="14" y="26" fill="#ff7075" class="font-mono" font-size="12" font-weight="700">✉ Direct Dispatch</text>
      <text x="14" y="48" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Personal Mailbox</text>
      <text x="14" y="68" fill="#94a3b8" class="font-mono" font-size="10.5">mohammadrehan432432@...</text>
      <text x="14" y="84" fill="#ff7075" class="font-mono" font-size="10">Send Email ➔</text>
