      <text x="8" y="14" fill="#6ee7b7" class="font-mono" font-size="10">FastAPI</text>

      <rect x="68" y="0" width="80" height="20" rx="4" fill="#101c38" stroke="#1d2d52" stroke-width="0.8"/>
      <text x="76" y="14" fill="#cbd5e1" class="font-mono" font-size="10">TypeScript</text>

      <rect x="154" y="0" width="68" height="20" rx="4" fill="#101c38" stroke="#1d2d52" stroke-width="0.8"/>
      <text x="162" y="14" fill="#cbd5e1" class="font-mono" font-size="10">Gemini</text>
    </g>
  </g>

