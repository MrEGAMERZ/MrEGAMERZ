    <rect x="0" y="0" width="4" height="142" rx="2" fill="#ff354f"/>

    <!-- Category Pill -->
    <rect x="16" y="14" width="138" height="18" rx="3" fill="#26101c" stroke="#ff354f" stroke-width="0.8"/>
    <text x="22" y="27" fill="#fda4af" class="font-mono" font-size="9" font-weight="700">CYBER THREAT INTEL</text>

    <!-- Project Title -->
    <text x="16" y="52" fill="#f8fafc" class="font-sans" font-size="16" font-weight="800">🔍 FraudLens — Phishing X-Ray</text>
    
    <!-- Description with balanced line wrap -->
    <text x="16" y="73" fill="#94a3b8" class="font-sans" font-size="11.5">
      Detects recruitment process compression (FFCS) across
    </text>
