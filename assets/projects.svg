      <text x="72" y="14" fill="#fda4af" class="font-mono" font-size="10">Llama-3.2</text>

      <rect x="152" y="0" width="94" height="20" rx="4" fill="#1e1236" stroke="#8b5cf6" stroke-width="0.8"/>
