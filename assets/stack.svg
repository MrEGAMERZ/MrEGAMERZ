<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="60%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="stack-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#247bff" fill-opacity="0.12"/>
    </pattern>

    <!-- Orbit Stroke Gradients -->
    <linearGradient id="orbit-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="orbit-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="orbit-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
    }
    .title {
      font-weight: 800;
      letter-spacing: -0.02em;
    }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="860" height="360" rx="16" fill="url(#stack-bg)"/>
  <rect x="10" y="10" width="860" height="360" rx="16" fill="url(#stack-dots)"/>
  <rect x="10" y="10" width="860" height="360" rx="16" stroke="url(#stack-border)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="95" height="20" rx="4" fill="#0d1b38" stroke="#247bff" stroke-width="1"/>
    <text x="8" y="14" fill="#247bff" class="font-mono" font-size="10.5" font-weight="700">TECH MATRIX</text>
    <text x="108" y="15" fill="#f8fafc" class="font-sans title" font-size="18">Orbital Engine &amp; Production Stack</text>
  </g>

  <!-- LEFT: 3 Tilted Elliptical Planetary Orbits (Animated Nodes) -->
  <g transform="translate(225, 205)">
    <!-- Central Core -->
    <circle cx="0" cy="0" r="28" fill="#0b1736" stroke="#247bff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#132a63"/>
    <circle cx="0" cy="0" r="4" fill="#60a5fa">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="38" text-anchor="middle" fill="#64748b" class="font-mono" font-size="9.5" font-weight="700">NEURAL CORE</text>

    <!-- Orbit 1: Inner Orbit (AI / ML Frameworks) tilted -18 deg -->
    <g transform="rotate(-18)">
      <ellipse cx="0" cy="0" rx="75" ry="46" fill="none" stroke="url(#orbit-grad-1)" stroke-width="1.2" stroke-dasharray="3,3"/>
      
      <!-- Node: PyTorch (animated along elliptical path) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(75, 0)">
          <circle cx="0" cy="0" r="14" fill="#1e1424" stroke="#ff354f" stroke-width="1.2"/>
          <text x="0" y="4" text-anchor="middle" fill="#ff4a68" class="font-mono" font-size="10" font-weight="800">PT</text>
        </g>
      </g>
      <!-- Node: Python (opposite position on same orbit) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(75, 0)">
          <circle cx="0" cy="0" r="14" fill="#0c1e3d" stroke="#247bff" stroke-width="1.2"/>
          <text x="0" y="4" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="10" font-weight="800">PY</text>
        </g>
      </g>
    </g>

    <!-- Orbit 2: Mid Orbit (Systems & Backend) tilted 25 deg -->
    <g transform="rotate(25)">
      <ellipse cx="0" cy="0" rx="120" ry="72" fill="none" stroke="url(#orbit-grad-2)" stroke-width="1.2" stroke-dasharray="4,4"/>

      <!-- Node: FastAPI -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="40" to="400" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(120, 0)">
          <circle cx="0" cy="0" r="15" fill="#092723" stroke="#10b981" stroke-width="1.2"/>
          <text x="0" y="4" text-anchor="middle" fill="#34d399" class="font-mono" font-size="9" font-weight="800">API</text>
        </g>
      </g>
      <!-- Node: Docker -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="220" to="580" dur="26s" repeatCount="indefinite"/>
        <g transform="translate(120, 0)">
          <circle cx="0" cy="0" r="15" fill="#0c2540" stroke="#0284c7" stroke-width="1.2"/>
          <text x="0" y="4" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="8.5" font-weight="800">DCK</text>
        </g>
      </g>
    </g>

    <!-- Orbit 3: Outer Orbit (Architecture & Native) tilted -8 deg -->
    <g transform="rotate(-8)">
      <ellipse cx="0" cy="0" rx="168" ry="98" fill="none" stroke="url(#orbit-grad-3)" stroke-width="1.2" stroke-dasharray="5,5"/>

      <!-- Node: Swift / macOS -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="34s" repeatCount="indefinite"/>
        <g transform="translate(168, 0)">
          <circle cx="0" cy="0" r="15" fill="#2d131f" stroke="#f43f5e" stroke-width="1.2"/>
          <text x="0" y="4" text-anchor="middle" fill="#fb7185" class="font-mono" font-size="9" font-weight="800">SWF</text>
        </g>
      </g>
      <!-- Node: TypeScript -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="34s" repeatCount="indefinite"/>
        <g transform="translate(168, 0)">
          <circle cx="0" cy="0" r="15" fill="#0d1f3b" stroke="#3b82f6" stroke-width="1.2"/>
          <text x="0" y="4" text-anchor="middle" fill="#60a5fa" class="font-mono" font-size="9.5" font-weight="800">TS</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Vertical Subtle Divider -->
  <line x1="430" y1="70" x2="430" y2="340" stroke="#17223b" stroke-width="1"/>

  <!-- RIGHT: Grouped Stack Chips Categorized cleanly -->
  <g transform="translate(460, 68)">
    
    <!-- CATEGORY 1: AI / ML & Research -->
    <g>
      <text x="0" y="14" fill="#247bff" class="font-mono" font-size="11.5" font-weight="700">◈ MACHINE LEARNING &amp; RESEARCH</text>
      
      <g transform="translate(0, 24)">
        <!-- Chip: PyTorch -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="76" height="26" rx="6" fill="#101c38" stroke="#247bff" stroke-width="1"/>
          <text x="10" y="17" fill="#e2e8f0" class="font-sans" font-size="11.5" font-weight="600">PyTorch</text>
        </g>
        <!-- Chip: Python -->
        <g transform="translate(84, 0)">
          <rect x="0" y="0" width="68" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">Python</text>
        </g>
        <!-- Chip: Llama-3.2 / GRPO -->
        <g transform="translate(160, 0)">
          <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e1028" stroke="#ff354f" stroke-width="1"/>
          <text x="10" y="17" fill="#fda4af" class="font-sans" font-size="11.5" font-weight="600">Llama-3.2 (GRPO)</text>
        </g>
        <!-- Chip: Gym/RL -->
        <g transform="translate(306, 0)">
          <rect x="0" y="0" width="70" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">OpenEnv</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 2: Systems, Backend & Agents -->
    <g transform="translate(0, 78)">
      <text x="0" y="14" fill="#38bdf8" class="font-mono" font-size="11.5" font-weight="700">⚡ BACKEND, AGENTS &amp; DEVOPS</text>
      
      <g transform="translate(0, 24)">
        <!-- Chip: FastAPI -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="74" height="26" rx="6" fill="#0c2420" stroke="#10b981" stroke-width="1"/>
          <text x="10" y="17" fill="#6ee7b7" class="font-sans" font-size="11.5" font-weight="600">FastAPI</text>
        </g>
        <!-- Chip: Docker -->
        <g transform="translate(82, 0)">
          <rect x="0" y="0" width="68" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">Docker</text>
        </g>
        <!-- Chip: Chrome MV3 Agents -->
        <g transform="translate(158, 0)">
          <rect x="0" y="0" width="134" height="26" rx="6" fill="#101c38" stroke="#247bff" stroke-width="1"/>
          <text x="10" y="17" fill="#93c5fd" class="font-sans" font-size="11.5" font-weight="600">Chrome MV3 (AEGIS)</text>
        </g>
        <!-- Chip: Linux -->
        <g transform="translate(300, 0)">
          <rect x="0" y="0" width="58" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">Linux</text>
        </g>
      </g>
    </g>

    <!-- CATEGORY 3: Native & Web Interfaces -->
    <g transform="translate(0, 156)">
      <text x="0" y="14" fill="#ff354f" class="font-mono" font-size="11.5" font-weight="700">🪟 NATIVE CLIENT &amp; UI CRAFT</text>
      
      <g transform="translate(0, 24)">
        <!-- Chip: Swift 5 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="72" height="26" rx="6" fill="#2d131f" stroke="#ff354f" stroke-width="1"/>
          <text x="10" y="17" fill="#fda4af" class="font-sans" font-size="11.5" font-weight="600">Swift 5</text>
        </g>
        <!-- Chip: AppKit / macOS -->
        <g transform="translate(80, 0)">
          <rect x="0" y="0" width="105" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">AppKit / macOS</text>
        </g>
        <!-- Chip: TypeScript -->
        <g transform="translate(193, 0)">
          <rect x="0" y="0" width="94" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">TypeScript</text>
        </g>
        <!-- Chip: C++ -->
        <g transform="translate(295, 0)">
          <rect x="0" y="0" width="50" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">C++</text>
        </g>
      </g>
    </g>

    <!-- Category 4: Evaluation & AI Safety -->
    <g transform="translate(0, 234)">
      <text x="0" y="14" fill="#a78bfa" class="font-mono" font-size="11.5" font-weight="700">🛡️ AI SAFETY &amp; EVALUATION</text>
      
      <g transform="translate(0, 24)">
        <!-- Chip: Hallucination Guarding -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="168" height="26" rx="6" fill="#181335" stroke="#8b5cf6" stroke-width="1"/>
          <text x="10" y="17" fill="#ddd6fe" class="font-sans" font-size="11.5" font-weight="600">Hallucination Guarding</text>
        </g>
        <!-- Chip: RAG / FAISS -->
        <g transform="translate(176, 0)">
          <rect x="0" y="0" width="90" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">RAG / FAISS</text>
        </g>
        <!-- Chip: Kendall's Tau -->
        <g transform="translate(274, 0)">
          <rect x="0" y="0" width="96" height="26" rx="6" fill="#101c38" stroke="#1e2d54" stroke-width="1"/>
          <text x="10" y="17" fill="#cbd5e1" class="font-sans" font-size="11.5">Kendall's Tau</text>
        </g>
      </g>
    </g>

  </g>
</svg>
