      <rect x="0" y="0" width="3" height="96" rx="1.5" fill="#0077b5"/>
      <text x="14" y="26" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700">💼 LinkedIn</text>
      <text x="14" y="48" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Mohammad Rehan</text>
      <text x="14" y="68" fill="#94a3b8" class="font-mono" font-size="10.5">in/mohammadrehan-dev</text>
      <text x="14" y="84" fill="#0077b5" class="font-mono" font-size="10">Connect ➔</text>
