<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="sp-conn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Subtle spider web pattern -->
    <pattern id="web-pat3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#e62429" stroke-opacity="0.03" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="196" rx="12" fill="url(#sp-conn-bg)"/>
  <rect x="2" y="2" width="876" height="196" rx="12" fill="url(#web-pat3)"/>
  <rect x="2" y="2" width="876" height="196" rx="12" stroke="#1c1f2e" stroke-width="1.2"/>

  <!-- Top Accent Bar -->
  <line x1="30" y1="2" x2="160" y2="2" stroke="#e62429" stroke-width="2.5"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="105" height="20" rx="4" fill="#180e14" stroke="#e62429" stroke-width="1"/>
    <text x="8" y="14" fill="#ff7075" class="font-mono" font-size="10.5" font-weight="700">WEB-SLINGER</text>
    <text x="118" y="15" fill="#ffffff" class="font-sans" font-size="17" font-weight="800">Dispatch &amp; Coordinates</text>
    <line x1="0" y1="26" x2="816" y2="26" stroke="#171a26" stroke-width="1"/>
  </g>

  <!-- 4 Clean Channel Badges -->
  <g transform="translate(32, 70)">
    
    <!-- LinkedIn -->
    <g transform="translate(0, 0)">
