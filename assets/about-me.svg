<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="lead-bio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <pattern id="bio-pat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 32 M 0 0 L 32 32" fill="none" stroke="#e62429" stroke-opacity="0.02" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="256" rx="10" fill="url(#lead-bio-bg)"/>
  <rect x="2" y="2" width="876" height="256" rx="10" fill="url(#bio-pat)"/>
  <rect x="2" y="2" width="876" height="256" rx="10" stroke="#1c2233" stroke-width="1.2"/>

  <!-- Top Accent Bar -->
  <line x1="36" y1="2" x2="180" y2="2" stroke="#e62429" stroke-width="3"/>

  <!-- Section Header -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#180e14" stroke="#e62429" stroke-width="1"/>
    <text x="8" y="14" fill="#ff7075" class="font-mono" font-size="10.5" font-weight="700">PROFILE &amp; PHILOSOPHY</text>
    <text x="154" y="15" fill="#ffffff" class="font-sans" font-size="17" font-weight="800">Engineering Approach &amp; Focus</text>
    <line x1="0" y1="26" x2="808" y2="26" stroke="#171c2a" stroke-width="1"/>
  </g>

  <!-- 3 Clean Columns: Core Specialization | System Engineering & Reliability | Background & Growth -->
  <g transform="translate(36, 72)">
    
    <!-- PILLAR 1: AGENTIC AI & EVALUATION -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="158" rx="8" fill="#0d111c" stroke="#1c2438" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="158" rx="1.5" fill="#e62429"/>

      <text x="14" y="24" fill="#ff7075" class="font-mono" font-size="11" font-weight="700">🤖 AGENTIC AI &amp; SYSTEMS</text>
      
      <text x="14" y="46" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">State, Memory &amp; Tool Use</text>
      <text x="14" y="66" fill="#94a3b8" class="font-sans" font-size="11.5">Focusing on how AI systems</text>
      <text x="14" y="82" fill="#94a3b8" class="font-sans" font-size="11.5">execute multi-step workflows,</text>
      <text x="14" y="98" fill="#94a3b8" class="font-sans" font-size="11.5">handle feedback &amp; recover safely.</text>

      <g transform="translate(14, 126)">
        <text x="0" y="0" fill="#64748b" class="font-mono" font-size="10">Tool Use · RAG · Evaluation</text>
      </g>
    </g>

    <!-- PILLAR 2: PRACTICAL SOFTWARE SYSTEMS -->
    <g transform="translate(276, 0)">
      <rect x="0" y="0" width="260" height="158" rx="8" fill="#0d111c" stroke="#1c2438" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="158" rx="1.5" fill="#00d2ff"/>

      <text x="14" y="24" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700">⚡ PRACTICAL ENGINEERING</text>
      
      <text x="14" y="46" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">From Prototype to Product</text>
      <text x="14" y="66" fill="#94a3b8" class="font-sans" font-size="11.5">Full-cycle builder across</text>
      <text x="14" y="82" fill="#94a3b8" class="font-sans" font-size="11.5">FastAPI, PostgreSQL &amp; React.</text>
      <text x="14" y="98" fill="#94a3b8" class="font-sans" font-size="11.5">Building reliable, audit-ready tech.</text>

      <g transform="translate(14, 126)">
        <text x="0" y="0" fill="#64748b" class="font-mono" font-size="10">Reliable Backends · Docker · CI</text>
      </g>
    </g>

    <!-- PILLAR 3: ACADEMIC FOUNDATION & MENTORSHIP -->
    <g transform="translate(552, 0)">
      <rect x="0" y="0" width="264" height="158" rx="8" fill="#0d111c" stroke="#1c2438" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="158" rx="1.5" fill="#10b981"/>

      <text x="14" y="24" fill="#34d399" class="font-mono" font-size="11" font-weight="700">🎓 ACADEMIC FOUNDATION</text>
      
      <text x="14" y="46" fill="#f8fafc" class="font-sans" font-size="13.5" font-weight="700">Presidency University</text>
      <text x="14" y="66" fill="#94a3b8" class="font-sans" font-size="11.5">B.Tech in Computer Science,</text>
      <text x="14" y="82" fill="#94a3b8" class="font-sans" font-size="11.5">AI/ML Specialization. Continuous</text>
      <text x="14" y="98" fill="#94a3b8" class="font-sans" font-size="11.5">builder, collaborator &amp; learner.</text>

      <g transform="translate(14, 126)">
        <text x="0" y="0" fill="#64748b" class="font-mono" font-size="10">Bengaluru, IN · High Agency</text>
      </g>
    </g>

  </g>
</svg>
