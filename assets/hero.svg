<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Dark Miles Morales background -->
    <linearGradient id="spider-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Crimson web accent line -->
    <linearGradient id="web-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e62429"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#e62429"/>
    </linearGradient>

    <!-- Subtle spider web pattern -->
    <pattern id="web-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#e62429" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="#e62429" stroke-opacity="0.03" stroke-width="0.8"/>
    </pattern>

    <!-- Clean reveal clip -->
    <clipPath id="hero-reveal">
      <rect x="0" y="45" width="880" height="75">
        <animate attributeName="width" values="0;880" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .title { font-weight: 900; letter-spacing: -0.02em; }
    .sub { font-weight: 500; }
  </style>

  <!-- Panel Base: clean flat card with subtle 1px border -->
  <rect x="2" y="2" width="876" height="256" rx="12" fill="url(#spider-bg)"/>
  <rect x="2" y="2" width="876" height="256" rx="12" fill="url(#web-grid)"/>
  <rect x="2" y="2" width="876" height="256" rx="12" stroke="#1c1f2e" stroke-width="1.2"/>

  <!-- Top spider accent edge -->
  <line x1="30" y1="2" x2="180" y2="2" stroke="#e62429" stroke-width="2.5"/>
  <line x1="180" y1="2" x2="240" y2="2" stroke="#00d2ff" stroke-width="2.5"/>

  <!-- Top Badge: SIH Semi-Finalist -->
  <g transform="translate(34, 28)">
    <rect x="0" y="0" width="176" height="22" rx="4" fill="#180e14" stroke="#e62429" stroke-width="1"/>
    <circle cx="10" cy="11" r="3" fill="#e62429"/>
    <text x="20" y="15" fill="#ff7075" class="font-mono" font-size="10" font-weight="700" letter-spacing="0.5">SIH '26 SEMI-FINALIST</text>

    <!-- Geographic node -->
    <text x="190" y="15" fill="#64748b" class="font-mono" font-size="11">BANGALORE, IN</text>
    <text x="300" y="15" fill="#334155" class="font-mono" font-size="11">//</text>
    <text x="320" y="15" fill="#94a3b8" class="font-mono" font-size="11">EARTH-616</text>
  </g>

  <!-- Clean Miles Morales Geometric Spider Emblem (Clean vector, not messy AI) -->
  <g transform="translate(775, 42)">
    <polygon points="35,0 42,14 28,14" fill="#e62429"/>
    <!-- Spider Body -->
    <polygon points="35,16 43,28 35,42 27,28" fill="#e62429"/>
    <!-- Sharp angular legs -->
    <path d="M 28 20 L 12 12 L 4 22" fill="none" stroke="#e62429" stroke-width="2" stroke-linecap="round"/>
    <path d="M 42 20 L 58 12 L 66 22" fill="none" stroke="#e62429" stroke-width="2" stroke-linecap="round"/>
    <path d="M 27 28 L 8 28 L 2 38" fill="none" stroke="#e62429" stroke-width="2" stroke-linecap="round"/>
    <path d="M 43 28 L 62 28 L 68 38" fill="none" stroke="#e62429" stroke-width="2" stroke-linecap="round"/>
    <path d="M 28 36 L 12 46 L 6 62" fill="none" stroke="#e62429" stroke-width="2" stroke-linecap="round"/>
    <path d="M 42 36 L 58 46 L 64 62" fill="none" stroke="#e62429" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Big Clean Name Reveal (Red and White contrast) -->
  <g clip-path="url(#hero-reveal)" transform="translate(34, 48)">
    <text x="0" y="62" fill="#ffffff" class="font-sans title" font-size="52">
      MOHAMMAD <tspan fill="#e62429">REHAN</tspan>
    </text>
  </g>

  <!-- Cycling Role in Spider Glitch / Minimal SMIL -->
  <g transform="translate(34, 150)">
    <text x="0" y="0" fill="#e62429" class="font-mono" font-size="14" font-weight="800">❯</text>
    
    <text x="20" y="0" fill="#f1f5f9" class="font-mono" font-size="15" font-weight="700">
      AI/ML Engineer &amp; Researcher
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="9s" repeatCount="indefinite" keyTimes="0;0.3;0.33;0.96;0.98;0.99;1"/>
    </text>
    
    <text x="20" y="0" fill="#00d2ff" class="font-mono" font-size="15" font-weight="700">
      Reinforcement Learning (GRPO) &amp; LLMs
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite" keyTimes="0;0.32;0.34;0.64;0.66;0.98;1"/>
    </text>

    <text x="20" y="0" fill="#e62429" class="font-mono" font-size="15" font-weight="700">
      Zero-Overhead macOS &amp; Native Systems Developer
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite" keyTimes="0;0.65;0.67;0.95;0.97;0.99;1"/>
    </text>
  </g>

  <!-- Concise pitch -->
  <g transform="translate(34, 185)">
    <text x="0" y="0" fill="#94a3b8" class="font-sans sub" font-size="14">
      "With great compute comes great responsibility." Architecting privacy agents (AEGIS) &amp; native desktop craft.
    </text>
  </g>

  <!-- Bottom status strip -->
  <g transform="translate(34, 222)">
    <line x1="0" y1="-12" x2="812" y2="-12" stroke="#1a1e2d" stroke-width="1"/>
    <circle cx="5" cy="-2" r="3" fill="#10b981"/>
    <text x="16" y="2" fill="#cbd5e1" class="font-mono" font-size="11.5">WEB OF SYSTEMS: ONLINE</text>
    <text x="230" y="2" fill="#475569" class="font-mono" font-size="11.5">|</text>
    <text x="250" y="2" fill="#94a3b8" class="font-mono" font-size="11.5">SPECIALIZATION: ON-DEVICE ML · GRPO · APPKIT</text>
    <text x="640" y="2" fill="#e62429" class="font-mono" font-size="11.5" font-weight="700">alias: MrEGAMERZ</text>
  </g>
</svg>
