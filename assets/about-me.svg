<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250" fill="none">
  <defs>
    <linearGradient id="sp-bio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Subtle spider web pattern -->
    <pattern id="web-pat2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#e62429" stroke-opacity="0.03" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="246" rx="12" fill="url(#sp-bio-bg)"/>
  <rect x="2" y="2" width="876" height="246" rx="12" fill="url(#web-pat2)"/>
  <rect x="2" y="2" width="876" height="246" rx="12" stroke="#1c1f2e" stroke-width="1.2"/>

  <!-- Top Accent Bar -->
  <line x1="30" y1="2" x2="160" y2="2" stroke="#e62429" stroke-width="2.5"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="85" height="20" rx="4" fill="#180e14" stroke="#e62429" stroke-width="1"/>
    <text x="8" y="14" fill="#ff7075" class="font-mono" font-size="10.5" font-weight="700">ORIGIN</text>
    <text x="98" y="15" fill="#ffffff" class="font-sans" font-size="17" font-weight="800">Behind The Mask</text>
    <line x1="0" y1="26" x2="816" y2="26" stroke="#171a26" stroke-width="1"/>
  </g>

  <!-- 3 Clean Columns: Education | Hardware & Consulting | Passions -->
  <g transform="translate(32, 72)">
    
    <!-- COL 1: ROOTS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="150" rx="8" fill="#0d101a" stroke="#1c2030" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="150" rx="1.5" fill="#e62429"/>

      <text x="14" y="24" fill="#ff7075" class="font-mono" font-size="11" font-weight="700">🎓 ROOTS &amp; ACADEMICS</text>
      
      <text x="14" y="48" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Presidency University</text>
      <text x="14" y="66" fill="#94a3b8" class="font-sans" font-size="11.5">Bangalore · Computer Science</text>

      <text x="14" y="94" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">International K-12</text>
      <text x="14" y="112" fill="#94a3b8" class="font-sans" font-size="11.5">Grew up &amp; schooled in Kuwait</text>

      <g transform="translate(14, 122)">
        <text x="0" y="14" fill="#64748b" class="font-mono" font-size="10">Kuwait ➔ Bangalore</text>
      </g>
    </g>

    <!-- COL 2: HARDWARE CRAFT -->
    <g transform="translate(276, 0)">
      <rect x="0" y="0" width="260" height="150" rx="8" fill="#0d101a" stroke="#1c2030" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="150" rx="1.5" fill="#00d2ff"/>

      <text x="14" y="24" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700">💼 HARDWARE AT THE METAL</text>
      
      <text x="14" y="48" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Custom Rig Engineering</text>
      <text x="14" y="66" fill="#94a3b8" class="font-sans" font-size="11.5">High-end PC builds &amp; optimization</text>

      <text x="14" y="94" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Workspace Architect</text>
      <text x="14" y="112" fill="#94a3b8" class="font-sans" font-size="11.5">Studio &amp; office workstation setups</text>

      <g transform="translate(14, 122)">
        <text x="0" y="14" fill="#64748b" class="font-mono" font-size="10">Silicon, thermals &amp; low latency</text>
      </g>
    </g>

    <!-- COL 3: FLOW & PASSIONS -->
    <g transform="translate(552, 0)">
      <rect x="0" y="0" width="264" height="150" rx="8" fill="#0d101a" stroke="#1c2030" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="150" rx="1.5" fill="#e62429"/>

      <text x="14" y="24" fill="#ff7075" class="font-mono" font-size="11" font-weight="700">⚡ FLOW &amp; SPEED</text>
      
      <text x="14" y="48" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Royal Enfield Rides</text>
      <text x="14" y="66" fill="#94a3b8" class="font-sans" font-size="11.5">Cruising highways to clear the mind</text>

      <text x="14" y="94" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700">Tactical FPS Gaming</text>
      <text x="14" y="112" fill="#94a3b8" class="font-sans" font-size="11.5">Competitive reflexes &amp; strategy</text>

      <g transform="translate(14, 122)">
        <text x="0" y="14" fill="#64748b" class="font-mono" font-size="10">Intuitive speed &amp; zero fluff</text>
      </g>
    </g>

  </g>
</svg>
